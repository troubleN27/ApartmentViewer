<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111214">
  <title data-i18n="meta.title"></title>
  <meta name="description" data-i18n-content="meta.description">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/fonts/manrope/400.css">
  <link rel="stylesheet" href="/vendor/fonts/manrope/500.css">
  <link rel="stylesheet" href="/vendor/fonts/manrope/600.css">
  <link rel="stylesheet" href="/vendor/fonts/cormorant/400.css">
  <link rel="stylesheet" href="/vendor/fonts/cormorant/500.css">
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="site-header">
    <button class="brand" data-action="home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V8l8-5 8 5v13M9 21v-7h6v7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      <span data-i18n="brand"></span>
    </button>
    <nav class="header-nav">
      <button class="nav-link" data-action="to-chess" data-i18n="nav.apartments"></button>
      <div class="lang-switch" role="group" data-i18n-aria="lang.label">
        <button data-lang="ru">RU</button>
        <button data-lang="uz">UZ</button>
      </div>
    </nav>
  </header>

  <main>
    <section id="view-home" class="view">
      <div class="hero">
        <img class="hero-photo" src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&amp;fit=crop&amp;w=1920&amp;h=1080&amp;q=70" data-photo alt="" aria-hidden="true">
        <div class="hero-shade" aria-hidden="true"></div>
        <div class="hero-inner reveal">
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1 class="hero-title" data-i18n="hero.title"></h1>
          <p class="hero-slogan" data-i18n="hero.slogan"></p>
          <button class="btn btn-dark" data-action="to-chess">
            <span data-i18n="hero.cta"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
        </div>
        <dl class="hero-stats reveal">
          <div><dt id="stat-floors">9</dt><dd data-i18n="hero.floors"></dd></div>
          <div><dt id="stat-apartments">54</dt><dd data-i18n="hero.apartments"></dd></div>
          <div><dt data-i18n="hero.deadlineValue"></dt><dd data-i18n="hero.deadline"></dd></div>
        </dl>
      </div>

      <section class="about">
        <div class="about-text">
          <p class="eyebrow" data-i18n="about.eyebrow"></p>
          <h2 data-i18n="about.title"></h2>
          <p class="section-hint" data-i18n="about.text"></p>
          <ul class="features">
            <li><strong data-i18n="about.f1.title"></strong><span data-i18n="about.f1.text"></span></li>
            <li><strong data-i18n="about.f2.title"></strong><span data-i18n="about.f2.text"></span></li>
            <li><strong data-i18n="about.f3.title"></strong><span data-i18n="about.f3.text"></span></li>
          </ul>
        </div>
        <figure class="photo about-photo">
          <img src="https://images.unsplash.com/photo-1493809842364-78817add7ffb?auto=format&amp;fit=crop&amp;w=1400&amp;h=880&amp;q=70" data-photo loading="lazy" data-i18n-alt="about.caption" alt="">
          <figcaption data-i18n="about.caption"></figcaption>
        </figure>
      </section>

      <section class="gallery">
        <div class="section-head">
          <p class="eyebrow" data-i18n="gallery.eyebrow"></p>
          <h2 data-i18n="gallery.title"></h2>
          <p class="section-hint" data-i18n="gallery.hint"></p>
        </div>
        <div class="gallery-grid">
          <figure class="photo"><img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&amp;fit=crop&amp;w=1400&amp;h=800&amp;q=70" data-photo loading="lazy" data-i18n-alt="room.living" alt=""><figcaption data-i18n="room.living"></figcaption></figure>
          <figure class="photo"><img src="https://images.unsplash.com/photo-1616594039964-ae9021a400a0?auto=format&amp;fit=crop&amp;w=1100&amp;h=800&amp;q=70" data-photo loading="lazy" data-i18n-alt="room.bedroom" alt=""><figcaption data-i18n="room.bedroom"></figcaption></figure>
          <figure class="photo"><img src="https://images.unsplash.com/photo-1484154218962-a197022b5858?auto=format&amp;fit=crop&amp;w=1100&amp;h=800&amp;q=70" data-photo loading="lazy" data-i18n-alt="room.kitchen" alt=""><figcaption data-i18n="room.kitchen"></figcaption></figure>
          <figure class="photo"><img src="https://images.unsplash.com/photo-1552321554-5fefe8c9ef14?auto=format&amp;fit=crop&amp;w=1400&amp;h=800&amp;q=70" data-photo loading="lazy" data-i18n-alt="room.bathroom" alt=""><figcaption data-i18n="room.bathroom"></figcaption></figure>
        </div>
      </section>

      <section id="chess" class="chess-section">
        <div class="section-head">
          <p class="eyebrow" data-i18n="chess.eyebrow"></p>
          <h2 data-i18n="chess.title"></h2>
          <p class="section-hint" data-i18n="chess.hint"></p>
        </div>
        <div class="chess-toolbar">
          <div class="filters" id="filters"></div>
          <div class="legend" id="legend"></div>
        </div>
        <p class="chess-status" id="chess-status" aria-live="polite"></p>
        <div class="chess" id="chess-grid"></div>
        <div class="tooltip" id="chess-tooltip" hidden></div>
      </section>
    </section>

    <section id="view-plan" class="view" hidden>
      <button class="back-link" data-action="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span data-i18n="plan.back"></span>
      </button>
      <div class="plan-layout">
        <div class="plan-main">
          <div class="plan-tools" id="plan-tools" hidden></div>
          <div class="catalog" id="catalog" hidden></div>
          <div class="plan-stage" id="plan-stage">
            <canvas id="plan-canvas"></canvas>
            <div class="tooltip" id="plan-tooltip" hidden></div>
            <div class="plan-message" id="plan-message" hidden></div>
          </div>
        </div>
        <aside class="apt-card" id="apt-card"></aside>
      </div>
    </section>
  </main>

  <div id="view-3d" class="view3d" hidden>
    <div class="view3d-canvas" id="view3d-canvas"></div>
    <div class="hud hud-top-left">
      <button class="panel icon-btn" data-action="close-3d" data-i18n-aria="v3d.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <div class="panel hud-info">
        <div class="hud-title" id="hud-title"></div>
        <div class="hud-sub" id="hud-sub"></div>
      </div>
    </div>
    <div class="hud hud-top-right">
      <div class="panel seg" id="seg-mode">
        <button data-mode="orbit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="4" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
          <span data-i18n="v3d.orbit"></span>
        </button>
        <button data-mode="walk">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12 8v6m0 0l-3 6m3-6l3 6M8 11l4-2 4 2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          <span data-i18n="v3d.walk"></span>
        </button>
      </div>
      <div class="panel seg" id="seg-finish">
        <button data-finish="whitebox" data-i18n="v3d.whitebox"></button>
        <button data-finish="finish" data-i18n="v3d.finish"></button>
      </div>
      <button class="panel icon-btn" data-action="fullscreen" data-i18n-aria="v3d.fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
    <div class="hud hud-furnish">
      <div class="panel plan-tools hud-tools" id="hud-tools"></div>
      <div class="panel catalog hud-catalog" id="hud-catalog" hidden></div>
    </div>
    <div class="hud hud-bottom-left panel minimap" id="minimap" hidden data-i18n-aria="v3d.minimap">
      <canvas id="minimap-canvas"></canvas>
    </div>
    <div class="hud hud-bottom panel hud-hint" id="hud-hint"></div>
    <div class="crosshair" id="crosshair" hidden></div>
  </div>

  <div class="modal" id="modal-height" hidden>
    <div class="modal-backdrop" data-close></div>
    <form class="modal-card" id="height-form" novalidate>
      <button type="button" class="modal-close" data-close data-i18n-aria="common.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <h3 data-i18n="height.title"></h3>
      <p class="modal-text" data-i18n="height.text"></p>
      <label class="field">
        <span data-i18n="height.label"></span>
        <input type="number" id="height-input" min="120" max="220" step="1" inputmode="numeric" placeholder="175">
      </label>
      <p class="field-error" id="height-error" hidden data-i18n="height.error"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" data-close data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn-dark" data-i18n="height.start"></button>
      </div>
    </form>
  </div>

  <div class="modal" id="modal-lead" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button type="button" class="modal-close" data-close data-i18n-aria="common.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <form id="lead-form" novalidate>
        <h3 data-i18n="lead.title"></h3>
        <p class="modal-text" id="lead-apartment"></p>
        <p class="modal-text" data-i18n="lead.text"></p>
        <label class="field">
          <span data-i18n="lead.name"></span>
          <input type="text" id="lead-name" maxlength="60" autocomplete="name">
        </label>
        <label class="field">
          <span data-i18n="lead.phone"></span>
          <input type="tel" id="lead-phone" maxlength="13" placeholder="+998901234567" autocomplete="tel">
          <small data-i18n="lead.phoneHint"></small>
        </label>
        <p class="field-error" id="lead-error" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" data-close data-i18n="common.cancel"></button>
          <button type="submit" class="btn btn-dark" id="lead-submit" data-i18n="lead.submit"></button>
        </div>
      </form>
      <div id="lead-success" hidden>
        <svg class="success-mark" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="1"/><path d="M15 24.5l6.5 6.5L34 18" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <h3 data-i18n="lead.successTitle"></h3>
        <p class="modal-text" id="lead-success-text"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-dark" data-close data-i18n="common.close"></button>
        </div>
      </div>
    </div>
  </div>

  <aside class="dev-panel" id="dev-panel" hidden>
    <h4 data-i18n="dev.title"></h4>
    <label class="field">
      <span data-i18n="dev.seed"></span>
      <input type="number" id="dev-seed" min="1" step="1" inputmode="numeric">
    </label>
    <button class="btn btn-dark btn-small" id="dev-random" data-i18n="dev.random"></button>
    <button class="btn btn-outline btn-small" id="dev-reset" data-i18n="dev.reset"></button>
    <p class="field-error" id="dev-error" hidden data-i18n="dev.failed"></p>
  </aside>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
